# .github/workflows/html-validate.yml

name: HTML Validation

on:
  push:
    branches: [main, feature3]
  pull_request:
    branches: [main]

jobs:
  validate-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate HTML files
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            html:
              - '**/*.html'

      - name: Run HTML validator
        if: steps.filter.outputs.html == 'true'
        uses: dorny/html-validator-action@v1
        with:
          folder: .
